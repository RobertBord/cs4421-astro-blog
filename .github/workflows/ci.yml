name: Continuous Integration
on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm' # Caches node_modules for high-speed runs

      - name: Install Project Dependencies
        run: npm ci # Clean, deterministic install from package-lock.json

      - name: Run Static Analysis & Tests
        run: |
          npm run lint
          npm run check
          npm run test:unit -- --run

      - name: Install Browser Test Runtime
        run: npx playwright install --with-deps chromium

      - name: Run Desktop and Mobile Launch Checks
        run: npm run test:e2e

      - name: Upload Browser Test Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/